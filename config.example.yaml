# Copy to config.yaml and edit. Every field under `brand` feeds the prompt agent.
brand:
  # Fill these in from the dashboard's Settings page. Specific answers give better prompts.
  niche: ""               # what the account is about, e.g. "10-second kitchen hacks"
  audience: ""            # who it is for
  voice: ""               # how captions and voiceovers should sound
  visual_style: ""        # how the videos should look
  recurring_subjects: ""  # people, places or objects that appear again and again
  avoid: ""               # things to keep out of every video

video:
  min_seconds: 10
  max_seconds: 12
  allowed_clip_seconds: [4, 6, 8]   # clip lengths your Flow plan produces
  music_volume: 0.25

agent:
  provider: gemini                 # gemini (free tier) or anthropic (paid Claude API)
  gemini_model: gemini-flash-latest
  gemini_fallback_models: [gemini-flash-lite-latest, gemini-pro-latest]   # tried in order when the first is busy
  model: claude-opus-5-5           # used only when provider is anthropic
  effort: medium

instagram:
  max_per_day: 3

publish:
  method: manual                    # manual (you post, no Meta account needed) or instagram_api
  platforms: [instagram, youtube]   # where you post: instagram, youtube (Shorts)
