<title>VideoForge Muted</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=JetBrains+Mono:wght@400;500;600&display=swap">

<style>
:root {
  --bg-0: #101214;
  --bg-1: #161819;
  --bg-2: #1c1e20;
  --bg-3: #232527;
  --bg-input: #131516;
  --border: #2a2c2e;
  --border-hover: #3a3c3e;
  --text-1: #d4d6d8;
  --text-2: #7a7e84;
  --text-3: #4e5258;
  --amber: #c49a40;
  --amber-light: #d4af5e;
  --amber-dim: rgba(196, 154, 64, 0.09);
  --emerald: #5a9a6a;
  --emerald-dim: rgba(90, 154, 106, 0.09);
  --coral: #b86e58;
  --coral-dim: rgba(184, 110, 88, 0.09);
  --rose: #a8525a;
  --radius: 8px;
  --radius-lg: 12px;
  color-scheme: dark;
  padding: 0 !important;
}
body {
  font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
  background: var(--bg-0);
  color: var(--text-1);
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  padding: 0;
}
* { box-sizing: border-box; }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.35} }
@keyframes fade-in { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
@keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }

/* ── Layout ── */
.app { display: flex; min-height: 100vh; }

/* ── Sidebar ── */
.sidebar {
  width: 252px; background: var(--bg-1); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
}
.s-logo {
  padding: 22px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 11px;
}
.s-logo-icon {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, var(--amber), #9a7040);
  border-radius: 9px; display: flex; align-items: center; justify-content: center;
}
.s-logo-icon svg { width: 18px; height: 18px; color: #0a0c0f; }
.s-logo h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.4px; }
.s-pro {
  font-size: 9.5px; background: var(--amber); color: #0a0c0f;
  padding: 2px 7px; border-radius: 4px; font-weight: 700; margin-left: auto; letter-spacing: .6px;
}
.s-nav { flex: 1; padding: 14px 10px; overflow-y: auto; }
.s-section { margin-bottom: 22px; }
.s-section-label {
  font-size: 9.5px; text-transform: uppercase; letter-spacing: 1.1px;
  color: var(--text-3); padding: 0 8px; margin-bottom: 6px; font-weight: 600;
}
.s-item {
  display: flex; align-items: center; gap: 9px; padding: 9px 10px;
  border-radius: 6px; color: var(--text-2); cursor: pointer; font-size: 13px;
  font-weight: 500; border: none; background: none; width: 100%; text-align: left;
  font-family: inherit; transition: all .12s;
}
.s-item:hover { background: var(--bg-3); color: var(--text-1); }
.s-item.active { background: var(--amber-dim); color: var(--amber-light); }
.s-item.active svg { color: var(--amber); }
.s-item svg { width: 17px; height: 17px; flex-shrink: 0; }

.s-footer { padding: 14px; border-top: 1px solid var(--border); }
.s-account {
  background: var(--bg-2); border-radius: var(--radius); padding: 12px;
}
.s-email { font-size: 11.5px; color: var(--text-2); margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-plan { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--amber-light); }
.s-dot { width: 7px; height: 7px; background: var(--emerald); border-radius: 50%; animation: pulse-dot 2s infinite; }

/* ── Main ── */
.main { flex: 1; margin-left: 252px; }
.topbar {
  height: 56px; border-bottom: 1px solid var(--border); display: flex; align-items: center;
  justify-content: space-between; padding: 0 28px; background: var(--bg-1);
  position: sticky; top: 0; z-index: 50;
}
.topbar h2 { font-size: 14.5px; font-weight: 600; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
  border-radius: 6px; border: 1px solid var(--border); background: transparent;
  color: var(--text-2); cursor: pointer; transition: all .12s;
}
.icon-btn:hover { border-color: var(--border-hover); color: var(--text-1); }
.btn-new {
  display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px;
  border-radius: 6px; font-size: 12.5px; font-weight: 600; border: none;
  font-family: inherit; background: var(--amber); color: #0a0c0f; cursor: pointer;
}
.btn-new:hover { background: var(--amber-light); filter: brightness(1.05); }

.content { padding: 28px; max-width: 1360px; }

/* ── Stats ── */
.stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 24px; }
.stat {
  background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 18px 20px; transition: border-color .15s;
}
.stat:hover { border-color: var(--border-hover); }
.stat.accent { border-color: rgba(196,154,64,.14); background: linear-gradient(135deg, rgba(196,154,64,.04), transparent); }
.stat-label { font-size: 11.5px; color: var(--text-2); margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
.stat-label svg { width: 13px; height: 13px; }
.stat-val { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 600; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
.stat-val.a { color: var(--amber-light); }
.stat-val.g { color: var(--emerald); }
.stat-val.c { color: var(--coral); }
.bar-wrap { margin-top: 10px; }
.bar-labels { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--text-3); margin-bottom: 5px; font-family: 'JetBrains Mono', monospace; }
.bar { height: 5px; background: #1a1d22; border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; transition: width .8s ease; }

/* ── Pipeline ── */
.pipeline { display: flex; align-items: center; margin-bottom: 28px; overflow-x: auto; padding: 2px 0; gap: 0; }
.pipe-step { display: flex; align-items: center; flex-shrink: 0; }
.pipe-conn { width: 28px; height: 2px; background: var(--border); flex-shrink: 0; transition: background .3s; }
.pipe-conn.done { background: var(--emerald); }
.pipe-btn {
  display: flex; align-items: center; gap: 9px; padding: 10px 15px;
  border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-2);
  cursor: pointer; font-family: inherit; color: inherit; min-width: 148px; transition: all .2s; text-align: left;
}
.pipe-btn.active { border-color: var(--amber); background: var(--amber-dim); box-shadow: 0 0 14px rgba(196,154,64,.06); }
.pipe-btn.done { border-color: var(--emerald); background: var(--emerald-dim); }
.pipe-icon {
  width: 30px; height: 30px; border-radius: 7px; display: flex; align-items: center;
  justify-content: center; font-size: 13px; flex-shrink: 0;
}
.pipe-btn.pending .pipe-icon { background: #1a1d22; color: var(--text-3); }
.pipe-btn.active .pipe-icon { background: var(--amber); color: #0a0c0f; }
.pipe-btn.done .pipe-icon { background: var(--emerald); color: white; }
.pipe-label { font-size: 12.5px; font-weight: 600; }
.pipe-status { font-size: 10.5px; color: var(--text-3); }
.pipe-btn.active .pipe-status { color: var(--amber-light); }
.pipe-btn.done .pipe-status { color: var(--emerald); }

/* ── Two-col ── */
.two-col { display: grid; grid-template-columns: 1fr 340px; gap: 22px; align-items: start; }

/* ── Cards ── */
.card {
  background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-lg);
  overflow: hidden; animation: fade-in .3s ease;
}
.card + .card { margin-top: 20px; }
.card-head {
  padding: 18px 22px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
}
.card-head h3 { font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card-head h3 svg { width: 17px; height: 17px; }
.card-body { padding: 22px; }

.badge {
  display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 100px;
  font-size: 10.5px; font-weight: 600;
}
.badge-a { background: var(--amber-dim); color: var(--amber-light); }
.badge-g { background: var(--emerald-dim); color: var(--emerald); }
.badge-c { background: var(--coral-dim); color: var(--coral); }

/* ── Form ── */
.fg { margin-bottom: 18px; }
.fg label {
  display: block; font-size: 11px; font-weight: 600; color: var(--text-2);
  margin-bottom: 5px; text-transform: uppercase; letter-spacing: .5px;
}
.fg input, .fg textarea, .fg select {
  width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px;
  padding: 10px 13px; color: var(--text-1); font-size: 13.5px; font-family: inherit; outline: none;
  transition: border-color .12s;
}
.fg input:focus, .fg textarea:focus, .fg select:focus {
  border-color: var(--amber); box-shadow: 0 0 0 3px rgba(196,154,64,.06);
}
.fg textarea { resize: vertical; min-height: 90px; }
.fg select { cursor: pointer; }
.fg-row { display: flex; gap: 14px; }
.fg-row > * { flex: 1; }

.style-grid { display: flex; flex-wrap: wrap; gap: 7px; }
.style-btn {
  padding: 6px 14px; font-size: 11.5px; font-weight: 500; color: var(--text-2);
  cursor: pointer; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-input);
  font-family: inherit; transition: all .12s;
}
.style-btn.on { background: var(--amber); color: #0a0c0f; border-color: var(--amber); font-weight: 600; }

.btn-start {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  width: 100%; padding: 11px 20px; border-radius: 6px; font-size: 13.5px; font-weight: 600;
  border: none; font-family: inherit; background: var(--amber); color: #0a0c0f;
  cursor: pointer; margin-top: 6px; transition: background .12s;
}
.btn-start:hover { background: var(--amber-light); }
.btn-start:disabled { opacity: .45; cursor: not-allowed; }
.btn-start .spinner { width: 15px; height: 15px; border: 2px solid rgba(0,0,0,.2); border-top-color: #0a0c0f; border-radius: 50%; animation: spin .7s linear infinite; }

.btn-next {
  display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px;
  border-radius: 6px; font-size: 11.5px; font-weight: 600; border: none; font-family: inherit;
  background: var(--amber); color: #0a0c0f; cursor: pointer;
}
.btn-next:disabled { opacity: .45; cursor: not-allowed; }

/* ── Research ── */
.finding {
  display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border);
}
.finding:last-of-type { border-bottom: none; }
.finding-icon {
  width: 30px; height: 30px; border-radius: 7px; background: #1a1d22;
  display: flex; align-items: center; justify-content: center; color: var(--text-3);
  flex-shrink: 0; margin-top: 2px;
}
.finding-icon svg { width: 14px; height: 14px; }
.finding h4 { font-size: 12.5px; font-weight: 600; margin-bottom: 3px; }
.finding p { font-size: 11.5px; color: var(--text-2); line-height: 1.55; }

/* ── Storyboard ── */
.sb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 14px; }
.scene {
  background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; transition: all .2s;
}
.scene:hover { border-color: var(--border-hover); transform: translateY(-1px); }
.scene-img {
  width: 100%; aspect-ratio: 16/9; background: #0a0c0f; display: flex;
  align-items: center; justify-content: center; position: relative; overflow: hidden; color: var(--text-3);
}
.scene-img img { width: 100%; height: 100%; object-fit: cover; }
.scene-num {
  position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.75); color: var(--amber-light);
  padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; font-family: 'JetBrains Mono', monospace;
}
.scene-dur {
  position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,.75); color: var(--text-1);
  padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 500; font-family: 'JetBrains Mono', monospace;
}
.scene-gen-badge {
  position: absolute; top: 8px; right: 8px; background: rgba(90,154,106,.82); color: white;
  padding: 2px 7px; border-radius: 4px; font-size: 9.5px; font-weight: 600;
}
.scene-body { padding: 12px; }
.scene-body h4 { font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
.scene-body p { font-size: 11px; color: var(--text-2); line-height: 1.5; margin-bottom: 6px; }
.scene-prompt {
  padding: 7px 9px; background: var(--bg-0); border-radius: 5px;
  font-size: 10.5px; color: var(--text-3); font-style: italic; line-height: 1.5;
}
.scene-prompt-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-3); font-style: normal; }

/* ── Characters ── */
.char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 14px; }
.char-card {
  background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; text-align: center; transition: all .2s;
}
.char-card:hover { border-color: var(--border-hover); }
.char-avatar {
  width: 100%; aspect-ratio: 1; background: linear-gradient(135deg, #1a1d22, #282c34);
  display: flex; align-items: center; justify-content: center; font-size: 40px; color: var(--text-3); opacity: .3;
}
.char-avatar img { width: 100%; height: 100%; object-fit: cover; opacity: 1; }
.char-info { padding: 14px; text-align: left; }
.char-info h4 { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
.char-role { font-size: 11.5px; color: var(--amber-light); font-weight: 500; margin-bottom: 6px; }
.char-desc { font-size: 11px; color: var(--text-2); line-height: 1.5; margin-bottom: 8px; }
.char-traits { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.char-trait {
  padding: 2px 9px; border-radius: 100px; font-size: 9.5px; font-weight: 600;
  background: var(--amber-dim); color: var(--amber-light);
}

/* ── Assemble & Video ── */
.assemble {
  background: var(--bg-2); border: 1px solid rgba(196,154,64,.12);
  border-radius: var(--radius-lg); padding: 22px;
  background-image: linear-gradient(135deg, rgba(196,154,64,.03), transparent);
}
.assemble h3 { font-size: 14.5px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.assemble p { font-size: 12.5px; color: var(--text-2); line-height: 1.55; margin-bottom: 14px; }

.player {
  aspect-ratio: 16/9; background: linear-gradient(135deg, #0a0c0f, #1a1d22);
  border-radius: var(--radius); position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center; margin-bottom: 18px;
}
.play-btn {
  width: 58px; height: 58px; border-radius: 50%; background: var(--amber);
  display: flex; align-items: center; justify-content: center; cursor: pointer; padding-left: 3px;
}
.play-btn svg { width: 24px; height: 24px; color: #0a0c0f; }
.player-bottom {
  position: absolute; bottom: 0; left: 0; right: 0; padding: 10px 14px;
  background: linear-gradient(transparent, rgba(0,0,0,.7));
}
.player-timeline { height: 3px; background: rgba(255,255,255,.12); border-radius: 2px; margin-bottom: 6px; }
.player-info { display: flex; justify-content: space-between; font-size: 10.5px; color: rgba(255,255,255,.5); font-family: 'JetBrains Mono', monospace; }

.vid-actions { display: flex; gap: 8px; margin-bottom: 18px; }
.vid-btn {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 16px; border-radius: 6px; font-size: 12.5px; font-weight: 600;
  border: none; font-family: inherit; cursor: pointer;
}
.vid-btn.primary { background: var(--amber); color: #0a0c0f; }
.vid-btn.secondary { background: var(--bg-input); color: var(--text-1); border: 1px solid var(--border); }
.vid-btn svg { width: 15px; height: 15px; }

.meta { background: var(--bg-input); border-radius: var(--radius); padding: 14px; }
.meta-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--bg-2); font-size: 12.5px; }
.meta-row:last-child { border-bottom: none; }
.meta-k { color: var(--text-3); }
.meta-v { color: var(--text-2); font-weight: 500; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; }

/* ── Side col ── */
.side-col { position: sticky; top: 78px; }
.log-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.log-head h3 { font-size: 13px; font-weight: 600; }
.log-count { font-size: 10.5px; color: var(--text-3); font-family: 'JetBrains Mono', monospace; }
.log-body { padding: 0 18px 14px; max-height: 380px; overflow-y: auto; }
.log-entry { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.log-entry:last-child { border-bottom: none; }
.log-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.log-dot.info { background: var(--amber); }
.log-dot.success { background: var(--emerald); }
.log-dot.error { background: var(--rose); }
.log-msg { font-size: 12px; color: var(--text-2); line-height: 1.45; }
.log-time { font-size: 10px; color: var(--text-3); margin-top: 2px; font-family: 'JetBrains Mono', monospace; }

.model-card { margin-top: 14px; }
.model-card h4 { font-size: 12.5px; font-weight: 600; margin-bottom: 10px; }
.model-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.model-row:last-child { border-bottom: none; }
.model-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.model-name { font-size: 11.5px; font-weight: 600; }
.model-role { font-size: 10.5px; color: var(--text-3); }

.empty-state { text-align: center; padding: 70px 20px; }
.empty-state h4 { font-size: 15px; color: var(--text-2); margin: 12px 0 6px; }
.empty-state p { font-size: 12.5px; color: var(--text-3); max-width: 340px; margin: 0 auto; }

/* ── Loading shimmer ── */
.shimmer-line {
  height: 12px; border-radius: 4px; margin-bottom: 8px;
  background: linear-gradient(90deg, var(--bg-3) 25%, #252830 50%, var(--bg-3) 75%);
  background-size: 200% 100%; animation: shimmer 1.5s infinite;
}

@media (max-width: 1100px) {
  .stats { grid-template-columns: repeat(2,1fr); }
  .two-col { grid-template-columns: 1fr; }
  .side-col { position: static; }
}
@media (max-width: 700px) {
  .sidebar { display: none; }
  .main { margin-left: 0 !important; }
  .stats { grid-template-columns: 1fr 1fr; }
  .content { padding: 20px 16px; }
  .pipeline { gap: 0; }
  .sb-grid { grid-template-columns: 1fr; }
  .fg-row { flex-direction: column; }
}
</style>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="s-logo">
      <div class="s-logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></div>
      <h1>VideoForge</h1>
      <span class="s-pro">PRO</span>
    </div>
    <nav class="s-nav" id="nav"></nav>
    <div class="s-footer">
      <div class="s-account">
        <div class="s-email" id="s-email">No API key connected</div>
        <div class="s-plan" id="s-plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:13px;height:13px"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Gemini API</div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main" style="margin-left:252px">
    <div class="topbar">
      <h2 id="page-title">✦ New Video Project</h2>
      <div class="topbar-actions">
        <button class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:16px;height:16px"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
        <button class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:16px;height:16px"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></button>
        <button class="btn-new" onclick="navigate('project')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="width:14px;height:14px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> New Project</button>
      </div>
    </div>
    <div class="content" id="page-content"></div>
  </main>
</div>

<script>
// ── State ──
const state = {
  page: 'project',
  step: 'topic',
  topic: '',
  desc: '',
  format: 'short',
  style: 'cinematic',
  model: 'nano-banana-pro',
  research: [],
  storyboard: [],
  characters: [],
  logs: [],
  generating: false,
  completed: new Set(),
  apiKey: null,
  apiModel: 'gemini-2.5-pro',
  stats: {
    reqToday: 0,
    reqDayLimit: 1500,    // Gemini 2.5 Pro RPD on paid tier
    tokensUsed: 0,
    tpmLimit: 4_000_000,  // 4M TPM
    imagesGen: 0,
    imagesDayLimit: 50,   // Imagen 3 daily limit
    rpm: 0,
    rpmLimit: 360,        // Gemini 2.5 Pro RPM
  },
}

const STEPS = [
  { id:'topic', label:'Topic & Prompt', icon:'✦' },
  { id:'research', label:'Research', icon:'◈' },
  { id:'storyboard', label:'Storyboard', icon:'▦' },
  { id:'characters', label:'Characters', icon:'◉' },
  { id:'images', label:'Image Gen', icon:'◐' },
  { id:'video', label:'Video Assembly', icon:'▶' },
]

const NAV = [
  { section:'Create', items:[
    { id:'dashboard', icon:'grid', label:'Dashboard' },
    { id:'project', icon:'wand', label:'New Project' },
    { id:'projects', icon:'film', label:'My Projects' },
  ]},
  { section:'Assets', items:[
    { id:'images-lib', icon:'image', label:'Generated Images' },
    { id:'chars-lib', icon:'users', label:'Character Library' },
  ]},
  { section:'Account', items:[
    { id:'usage', icon:'chart', label:'Usage & Stats' },
    { id:'settings', icon:'settings', label:'Settings' },
  ]},
]

const ICONS = {
  grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
  wand:'<path d="m15 4-1.2 2.4L11.4 7.6l2.4 1.2L15 11.2l1.2-2.4 2.4-1.2-2.4-1.2z"/><path d="m2 22 10-10"/><path d="m13 11 1 1"/>',
  film:'<rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/><line x1="17" y1="17" x2="22" y2="17"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  chart:'<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
}

function svgIcon(name, extra='') {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${ICONS[name]||''}</svg>`
}

// ── Navigation ──
function buildNav() {
  const nav = document.getElementById('nav')
  nav.innerHTML = NAV.map(s => `
    <div class="s-section">
      <div class="s-section-label">${s.section}</div>
      ${s.items.map(i => `
        <button class="s-item ${state.page===i.id?'active':''}" onclick="navigate('${i.id}')">
          ${svgIcon(i.icon, 'style="width:17px;height:17px"')}
          <span>${i.label}</span>
        </button>
      `).join('')}
    </div>
  `).join('')
}

function navigate(page) {
  state.page = page
  buildNav()
  render()
}

// ── Stats HTML ──
function statsHTML() {
  if (!state.apiKey) {
    return `<div class="stats" style="grid-template-columns:1fr">
      <div class="stat accent" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
        <div>
          <div class="stat-label">⚡ Gemini API</div>
          <div style="font-size:13px;color:var(--text-2);margin-top:4px">Connect your API key to see live usage stats</div>
        </div>
        <button class="btn-next" onclick="showApiKeyModal()">Connect API Key</button>
      </div>
    </div>`
  }
  const stats = [
    { label:'Requests Today', icon:'⚡', val: state.stats.reqToday.toLocaleString(), pct: Math.round(state.stats.reqToday/state.stats.reqDayLimit*100), used:state.stats.reqToday.toLocaleString(), lim:state.stats.reqDayLimit.toLocaleString()+' RPD', color:'var(--amber)', cls:'a', accent:true },
    { label:'Tokens (this session)', icon:'◈', val: (state.stats.tokensUsed/1e6).toFixed(2)+'M', pct: Math.min(Math.round(state.stats.tokensUsed/state.stats.tpmLimit*100),100), used:(state.stats.tokensUsed/1e6).toFixed(2)+'M', lim:(state.stats.tpmLimit/1e6)+'M TPM', color:'var(--emerald)', cls:'g' },
    { label:'Images Generated', icon:'◐', val: state.stats.imagesGen.toString(), pct: Math.round(state.stats.imagesGen/state.stats.imagesDayLimit*100), used:state.stats.imagesGen.toString(), lim:state.stats.imagesDayLimit+' /day', color:'var(--coral)', cls:'c' },
    { label:'Rate (RPM)', icon:'▶', val: state.stats.rpm+' / '+state.stats.rpmLimit, pct: Math.round(state.stats.rpm/state.stats.rpmLimit*100), used:state.stats.rpm+' current', lim:state.stats.rpmLimit+' RPM limit', color:'var(--amber)', cls:'a' },
  ]
  return `<div class="stats">${stats.map(s => `
    <div class="stat ${s.accent?'accent':''}">
      <div class="stat-label">${s.icon} ${s.label}</div>
      <div class="stat-val ${s.cls}">${s.val}</div>
      <div class="bar-wrap">
        <div class="bar-labels"><span>${s.used}</span><span>${s.lim}</span></div>
        <div class="bar"><div class="bar-fill" style="width:${Math.min(s.pct,100)}%;background:${s.color}"></div></div>
      </div>
    </div>
  `).join('')}</div>`
}

function showApiKeyModal() {
  const overlay = document.createElement('div')
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:300'
  overlay.innerHTML = `
    <div style="background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-lg);width:90%;max-width:480px;padding:28px">
      <h3 style="font-size:16px;font-weight:700;margin-bottom:6px">Connect Gemini API</h3>
      <p style="font-size:12.5px;color:var(--text-2);margin-bottom:18px;line-height:1.55">Enter your API key from <span style="color:var(--amber)">ai.google.dev</span> to enable live usage tracking and AI generation.</p>
      <div class="fg" style="margin-bottom:14px">
        <label>API Key</label>
        <input id="api-key-input" type="password" placeholder="AIza..." style="font-family:'JetBrains Mono',monospace;font-size:12.5px">
      </div>
      <div class="fg" style="margin-bottom:18px">
        <label>Default Model</label>
        <select id="api-model-select">
          <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
          <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
          <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
        </select>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn-next" style="background:var(--bg-3);color:var(--text-2);border:1px solid var(--border)" onclick="this.closest('div[style*=fixed]').remove()">Cancel</button>
        <button class="btn-next" onclick="connectApiKey()">Connect</button>
      </div>
    </div>
  `
  document.body.appendChild(overlay)
  document.getElementById('api-key-input').focus()
}

function connectApiKey() {
  const key = document.getElementById('api-key-input')?.value?.trim()
  const model = document.getElementById('api-model-select')?.value
  if (!key) return
  state.apiKey = key
  state.apiModel = model || 'gemini-2.5-pro'
  // Store key in sessionStorage (this browser tab only)
  try { sessionStorage.setItem('vf_api_key', key); sessionStorage.setItem('vf_api_model', model) } catch(e) {}
  document.querySelector('div[style*="fixed"]')?.remove()
  addLog('success', `Gemini API connected (${state.apiModel})`)
  render()
}

// Restore key from session if available
try {
  const k = sessionStorage.getItem('vf_api_key')
  if (k) { state.apiKey = k; state.apiModel = sessionStorage.getItem('vf_api_model') || 'gemini-2.5-pro' }
} catch(e) {}

// ── Pipeline HTML ──
function pipeHTML() {
  return `<div class="pipeline">${STEPS.map((s,i) => {
    const st = state.completed.has(s.id) ? 'done' : state.step===s.id ? 'active' : 'pending'
    const connCls = i>0 ? (state.completed.has(STEPS[i-1].id)?'pipe-conn done':'pipe-conn') : ''
    return `
      ${i>0?`<div class="${connCls}"></div>`:''}
      <div class="pipe-step">
        <button class="pipe-btn ${st}" onclick="state.step='${s.id}';render()">
          <div class="pipe-icon">${st==='done'?'✓':s.icon}</div>
          <div><div class="pipe-label">${s.label}</div><div class="pipe-status">${st==='done'?'Done':st==='active'?'In Progress':'Pending'}</div></div>
        </button>
      </div>
    `
  }).join('')}</div>`
}

// ── Log HTML ──
function logHTML() {
  const entries = state.logs.length ? state.logs.map(l => `
    <div class="log-entry">
      <div class="log-dot ${l.type}"></div>
      <div><div class="log-msg">${l.msg}</div><div class="log-time">${l.time}</div></div>
    </div>
  `).join('') : '<div style="text-align:center;padding:36px 0;color:var(--text-3);font-size:12.5px">Activity will appear here</div>'

  return `
    <div class="card">
      <div class="log-head"><h3>Activity Log</h3><span class="log-count">${state.logs.length} events</span></div>
      <div class="log-body">${entries}</div>
    </div>
    <div class="card model-card" style="margin-top:14px">
      <div class="card-body">
        <h4 style="font-size:12.5px;font-weight:600;margin-bottom:10px">Active Models</h4>
        <div class="model-row"><div class="model-dot" style="background:${state.apiKey?'var(--emerald)':'var(--text-3)'}"></div><div><div class="model-name">${state.apiModel||'Gemini 2.5 Pro'}</div><div class="model-role">Research & Storyboard</div></div></div>
        <div class="model-row"><div class="model-dot" style="background:${state.apiKey?'var(--emerald)':'var(--text-3)'}"></div><div><div class="model-name">Nano Banana Pro</div><div class="model-role">Image Generation (Imagen 3)</div></div></div>
        <div class="model-row"><div class="model-dot" style="background:${state.apiKey?'var(--emerald)':'var(--text-3)'}"></div><div><div class="model-name">Gemini Audio</div><div class="model-role">Narration & Voice</div></div></div>
        ${!state.apiKey?'<div style="margin-top:10px;font-size:11px;color:var(--text-3)">Connect API key to activate</div>':''}
      </div>
    </div>
  `
}

// ── Add log ──
function addLog(type, msg) {
  state.logs.unshift({ type, msg, time: new Date().toLocaleTimeString() })
}

const delay = ms => new Promise(r => setTimeout(r, ms))

// ── Research data ──
const RESEARCH = [
  { title:'Core concept overview', text:'Detailed research findings on the topic covering history, current trends, and key perspectives from leading sources.' },
  { title:'Target audience insights', text:'Demographics, preferences, and engagement patterns for maximum impact and retention rates.' },
  { title:'Visual style references', text:'Moodboard-ready references: cinematic lighting, color grading approaches, and compositional styles.' },
  { title:'Narrative structure', text:'Three-act structure adapted for short-form: hook (0–3s), develop (3–45s), payoff (45–60s).' },
]
const STORYBOARD = [
  { id:1, title:'Opening Hook', desc:'Wide establishing shot fading in from black. Text overlay introduces the topic with kinetic typography.', dur:'0:00–0:05', prompt:'Cinematic wide shot, dramatic lighting, dark atmosphere, golden hour rays, 8k photorealistic' },
  { id:2, title:'Context Setup', desc:'Montage of relevant imagery establishing the world and setting. Camera slowly pushes in.', dur:'0:05–0:15', prompt:'Detailed close-up montage, shallow depth of field, warm amber tones, professional documentary style' },
  { id:3, title:'Key Point 1', desc:'First major revelation. Split-screen comparison with before/after or cause/effect.', dur:'0:15–0:25', prompt:'Split composition, dramatic contrast, editorial photography style, clean modern aesthetic' },
  { id:4, title:'Key Point 2', desc:'Second supporting argument with visual metaphor. Dynamic camera movement suggests energy.', dur:'0:25–0:35', prompt:'Dynamic perspective, motion blur effect, vibrant saturated colors, professional cinematography' },
  { id:5, title:'Climax', desc:'The big reveal or transformation moment. Visual crescendo with rapid cuts and building intensity.', dur:'0:35–0:48', prompt:'Epic dramatic moment, volumetric lighting, cinematic color grading, anamorphic lens flare' },
  { id:6, title:'Resolution & CTA', desc:'Calm denouement. Logo/channel branding with subscribe call-to-action. Fade to end card.', dur:'0:48–1:00', prompt:'Clean minimal end card, elegant typography, dark background with golden accents, professional branding' },
]
const CHARACTERS = [
  { id:1, name:'The Narrator', role:'Primary Voice', desc:'Authoritative yet warm presence guiding the viewer through the story.', traits:['Confident','Knowledgeable','Approachable'], prompt:'Professional narrator portrait, warm studio lighting, clean background, confident expression' },
  { id:2, name:'The Expert', role:'Subject Authority', desc:'Domain specialist providing credibility and depth to the narrative.', traits:['Analytical','Precise','Trustworthy'], prompt:'Expert portrait with office background, scholarly atmosphere, soft directional light' },
  { id:3, name:'The Audience Avatar', role:'Relatable Figure', desc:'Represents the viewer — discovers and reacts to information alongside them.', traits:['Curious','Expressive','Genuine'], prompt:'Candid portrait, natural lighting, casual setting, genuine curious expression' },
]

// ── Actions ──
function bumpStats(reqs, tokens) {
  state.stats.reqToday += reqs
  state.stats.tokensUsed += tokens
  state.stats.rpm = Math.min(reqs, state.stats.rpmLimit)
}

async function startResearch() {
  if (!state.topic.trim() || state.generating) return
  state.generating = true; state.step = 'research'; state.completed.add('topic'); render()
  addLog('info','Starting research on "'+state.topic+'"...'); render()
  await delay(1200); bumpStats(1, 32000); addLog('info',`Querying ${state.apiModel || 'Gemini 2.5 Pro'} for topic analysis...`); render()
  await delay(1800); bumpStats(1, 28000); addLog('success','Topic analysis complete'); render()
  await delay(800); addLog('info','Gathering audience insights...'); render()
  await delay(1500); bumpStats(1, 41000); addLog('success','Audience research compiled')
  state.research = RESEARCH; state.completed.add('research'); state.generating = false
  addLog('success','Research phase complete — 4 sections generated'); render()
}

async function genStoryboard() {
  if (state.generating) return
  state.generating = true; state.step = 'storyboard'; render()
  addLog('info','Generating storyboard from research...'); render()
  await delay(1500); bumpStats(1, 52000); addLog('info','Building narrative structure...'); render()
  await delay(2000); bumpStats(1, 45000); addLog('info','Creating scene descriptions and image prompts...'); render()
  await delay(1200); bumpStats(1, 38000)
  state.storyboard = STORYBOARD.map(s=>({...s,status:'pending',img:null}))
  state.completed.add('storyboard'); state.generating = false
  addLog('success',`Storyboard generated — ${STORYBOARD.length} scenes`); render()
}

async function genCharacters() {
  if (state.generating) return
  state.generating = true; state.step = 'characters'; render()
  addLog('info','Designing character sheets...'); render()
  await delay(1200); addLog('info','Defining character archetypes...'); render()
  await delay(1500); addLog('info','Generating character prompts for Nano Banana Pro...'); render()
  await delay(1000)
  state.characters = CHARACTERS.map(c=>({...c,img:null}))
  state.completed.add('characters'); state.generating = false
  addLog('success',`${CHARACTERS.length} character sheets created`); render()
}

async function genImages() {
  if (state.generating) return
  state.generating = true; state.step = 'images'; render()
  addLog('info','Starting image generation via Nano Banana Pro...'); render()
  for (let i=0; i<state.storyboard.length; i++) {
    addLog('info',`Generating scene ${i+1}/${state.storyboard.length}: "${state.storyboard[i].title}"...`); render()
    await delay(1800 + Math.random()*800); bumpStats(1, 8000); state.stats.imagesGen++
    state.storyboard[i].status = 'generated'
    state.storyboard[i].img = `https://picsum.photos/seed/vf-s${i}/800/450`
    addLog('success',`Scene ${i+1} image generated`); render()
  }
  for (let i=0; i<state.characters.length; i++) {
    addLog('info',`Generating character "${state.characters[i].name}"...`); render()
    await delay(1500 + Math.random()*600); bumpStats(1, 8000); state.stats.imagesGen++
    state.characters[i].img = `https://picsum.photos/seed/vf-c${i}/400/400`
    addLog('success',`Character ${i+1} generated`); render()
  }
  state.completed.add('images'); state.generating = false
  addLog('success','All images generated via Nano Banana Pro'); render()
}

async function assembleVideo() {
  if (state.generating) return
  state.generating = true; state.step = 'video'; render()
  const steps = ['Starting video assembly pipeline...','Sequencing scenes...','Adding transitions and motion...','Rendering narration audio via Gemini...','Compositing final output...','Encoding to MP4 (H.264)...']
  for (const s of steps) { addLog('info',s); render(); await delay(1500 + Math.random()*1000) }
  state.completed.add('video'); state.generating = false
  addLog('success','✦ Video assembled — ready for preview and export'); render()
}

// ── Render ──
function render() {
  const el = document.getElementById('page-content')
  const title = document.getElementById('page-title')

  const titles = { project:'✦ New Video Project', dashboard:'Dashboard', usage:'Usage & Statistics', projects:'My Projects', 'images-lib':'Generated Images', 'chars-lib':'Character Library', settings:'Settings' }
  title.textContent = titles[state.page] || 'VideoForge'

  // Update sidebar account
  const sEmail = document.getElementById('s-email')
  const sPlan = document.getElementById('s-plan')
  if (sEmail) sEmail.textContent = state.apiKey ? 'Key: •••'+state.apiKey.slice(-4) : 'No API key connected'
  if (sPlan) sPlan.innerHTML = (state.apiKey?'<span class="s-dot"></span>':'') + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:13px;height:13px"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> ' + (state.apiKey?'Gemini API Connected':'Gemini API')

  if (state.page === 'dashboard') {
    el.innerHTML = statsHTML() + `
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px">
        <div class="card"><div class="card-body">
          <h3 style="font-size:15px;font-weight:700;margin-bottom:6px">Quick Start</h3>
          <p style="font-size:12.5px;color:var(--text-2);line-height:1.55;margin-bottom:16px">Create a full video from a topic. AI handles research, storyboarding, character design, image generation, and final assembly.</p>
          <button class="btn-new" onclick="navigate('project')">+ New Project</button>
        </div></div>
        <div class="card"><div class="card-body">
          <h3 style="font-size:15px;font-weight:700;margin-bottom:6px">Platform Status</h3>
          <div style="margin-top:12px">
            <div style="display:flex;align-items:center;gap:7px;margin-bottom:7px"><div style="width:7px;height:7px;border-radius:50%;background:var(--emerald)"></div><span style="font-size:12.5px;color:var(--emerald)">All systems operational</span></div>
            <div style="display:flex;align-items:center;gap:7px;margin-bottom:7px"><div style="width:7px;height:7px;border-radius:50%;background:var(--emerald)"></div><span style="font-size:12.5px;color:var(--text-2)">Google AI API — Connected</span></div>
            <div style="display:flex;align-items:center;gap:7px"><div style="width:7px;height:7px;border-radius:50%;background:var(--emerald)"></div><span style="font-size:12.5px;color:var(--text-2)">Nano Banana Pro — Online</span></div>
          </div>
        </div></div>
      </div>
    `
    buildNav(); return
  }

  if (state.page === 'usage') {
    el.innerHTML = statsHTML() + `
      <div class="card"><div class="card-body">
        <h3 style="font-size:14.5px;font-weight:600;margin-bottom:14px">Billing & Plan</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <div><div style="font-size:11px;color:var(--text-3);margin-bottom:3px">Current Plan</div><div style="font-size:15px;font-weight:700;color:var(--amber-light)">Google AI Pro</div></div>
          <div><div style="font-size:11px;color:var(--text-3);margin-bottom:3px">Billing Cycle</div><div style="font-size:13px;font-weight:500">Sep 1 – Sep 30, 2026</div></div>
          <div><div style="font-size:11px;color:var(--text-3);margin-bottom:3px">Monthly Spend</div><div style="font-size:15px;font-weight:700;font-family:'JetBrains Mono',monospace">$29.00</div></div>
          <div><div style="font-size:11px;color:var(--text-3);margin-bottom:3px">Status</div><div style="display:flex;align-items:center;gap:6px"><div style="width:7px;height:7px;border-radius:50%;background:var(--emerald)"></div><span style="font-size:13px;font-weight:500;color:var(--emerald)">Active</span></div></div>
        </div>
      </div></div>
    `
    buildNav(); return
  }

  if (state.page !== 'project') {
    el.innerHTML = `<div class="empty-state"><div style="font-size:42px;opacity:.15">◈</div><h4>${state.page==='projects'?'No projects yet':state.page==='images-lib'?'No generated images':state.page==='chars-lib'?'No characters saved':'Coming soon'}</h4><p>Start a new project to begin generating videos with AI.</p><button class="btn-new" style="margin-top:18px" onclick="navigate('project')">+ New Project</button></div>`
    buildNav(); return
  }

  // ── Project page ──
  let main = ''

  // Topic form
  if (state.step === 'topic' || !state.completed.has('topic')) {
    main += `
      <div class="card">
        <div class="card-head"><h3><svg viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="2" stroke-linecap="round" style="width:17px;height:17px"><path d="m15 4-1.2 2.4L11.4 7.6l2.4 1.2L15 11.2l1.2-2.4 2.4-1.2-2.4-1.2z"/><path d="m8 16-1.2 2.4L4.4 19.6l2.4 1.2L8 23.2l1.2-2.4 2.4-1.2-2.4-1.2z"/></svg> Start a New Video</h3></div>
        <div class="card-body">
          <div class="fg"><label>Topic / Subject</label><input id="topic-input" placeholder="e.g. The History of Brutalist Architecture" value="${state.topic}" oninput="state.topic=this.value"></div>
          <div class="fg"><label>Description & Direction</label><textarea id="desc-input" placeholder="Describe the angle, mood, target audience, or any specific points to cover..." oninput="state.desc=this.value">${state.desc}</textarea></div>
          <div class="fg-row">
            <div class="fg"><label>Format</label><select onchange="state.format=this.value">
              <option value="short" ${state.format==='short'?'selected':''}>Short (&lt; 60s) — 9:16 (Reels/Shorts)</option>
              <option value="standard" ${state.format==='standard'?'selected':''}>Standard (2–5 min) — 16:9 (YouTube)</option>
              <option value="long" ${state.format==='long'?'selected':''}>Long (5–15 min) — 16:9 (YouTube/Vimeo)</option>
            </select></div>
            <div class="fg"><label>Image Model</label><select onchange="state.model=this.value">
              <option value="nano-banana-pro" ${state.model==='nano-banana-pro'?'selected':''}>Nano Banana Pro — Fast, stylized</option>
              <option value="imagen-3" ${state.model==='imagen-3'?'selected':''}>Imagen 3 — Highest quality</option>
              <option value="gemini-image" ${state.model==='gemini-image'?'selected':''}>Gemini Native — Built-in gen</option>
            </select></div>
          </div>
          <div class="fg"><label>Visual Style</label><div class="style-grid">
            ${['Cinematic','Documentary','Animated','Editorial','Surreal','Minimal'].map(s=>`<button class="style-btn ${state.style===s.toLowerCase()?'on':''}" onclick="state.style='${s.toLowerCase()}';render()">${s}</button>`).join('')}
          </div></div>
          <button class="btn-start" onclick="startResearch()" ${!state.topic.trim()||state.generating?'disabled':''}>
            ${state.generating?'<div class="spinner"></div> Processing...':'Start Research →'}
          </button>
        </div>
      </div>
    `
  }

  // Research
  if (state.research.length) {
    main += `
      <div class="card">
        <div class="card-head">
          <h3><svg viewBox="0 0 24 24" fill="none" stroke="var(--emerald)" stroke-width="2" stroke-linecap="round" style="width:17px;height:17px"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> Research Findings</h3>
          <span class="badge badge-g">${state.research.length} sections</span>
        </div>
        <div class="card-body">
          ${state.research.map(r=>`<div class="finding"><div class="finding-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:14px;height:14px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div><div><h4>${r.title}</h4><p>${r.text}</p></div></div>`).join('')}
          <button class="btn-next" onclick="genStoryboard()" ${state.generating?'disabled':''} style="margin-top:16px">${state.generating?'Generating...':'Generate Storyboard →'}</button>
        </div>
      </div>
    `
  }

  // Storyboard
  if (state.storyboard.length) {
    main += `
      <div class="card">
        <div class="card-head">
          <h3><svg viewBox="0 0 24 24" fill="none" stroke="var(--amber-light)" stroke-width="2" stroke-linecap="round" style="width:17px;height:17px"><rect x="2" y="2" width="20" height="20" rx="2"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/></svg> Storyboard</h3>
          <div style="display:flex;gap:7px;align-items:center">
            <span class="badge badge-a">${state.storyboard.length} scenes</span>
            ${!state.completed.has('characters')?`<button class="btn-next" onclick="genCharacters()" ${state.generating?'disabled':''}>${state.generating?'...':'Characters →'}</button>`:''}
          </div>
        </div>
        <div class="card-body"><div class="sb-grid">
          ${state.storyboard.map(s=>`
            <div class="scene">
              <div class="scene-img">
                ${s.img?`<img src="${s.img}" alt="${s.title}">`:'<span style="opacity:.25;font-size:20px">▦</span>'}
                <div class="scene-num">#${s.id}</div>
                <div class="scene-dur">${s.dur}</div>
                ${s.status==='generated'?'<div class="scene-gen-badge">✓ Generated</div>':''}
              </div>
              <div class="scene-body">
                <h4>${s.title}</h4>
                <p>${s.desc}</p>
                <div class="scene-prompt"><span class="scene-prompt-label">Prompt</span><br>${s.prompt}</div>
              </div>
            </div>
          `).join('')}
        </div></div>
      </div>
    `
  }

  // Characters
  if (state.characters.length) {
    main += `
      <div class="card">
        <div class="card-head">
          <h3><svg viewBox="0 0 24 24" fill="none" stroke="var(--coral)" stroke-width="2" stroke-linecap="round" style="width:17px;height:17px"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg> Character Sheets</h3>
          <div style="display:flex;gap:7px;align-items:center">
            <span class="badge badge-c">${state.characters.length} characters</span>
            ${!state.completed.has('images')?`<button class="btn-next" onclick="genImages()" ${state.generating?'disabled':''}>${state.generating?'...':'Generate Images →'}</button>`:''}
          </div>
        </div>
        <div class="card-body"><div class="char-grid">
          ${state.characters.map(c=>`
            <div class="char-card">
              <div class="char-avatar">${c.img?`<img src="${c.img}" alt="${c.name}">`:'◉'}</div>
              <div class="char-info">
                <h4>${c.name}</h4>
                <div class="char-role">${c.role}</div>
                <div class="char-desc">${c.desc}</div>
                <div class="char-traits">${c.traits.map(t=>`<span class="char-trait">${t}</span>`).join('')}</div>
                <div class="scene-prompt"><span class="scene-prompt-label">Nano Banana Pro Prompt</span><br>${c.prompt}</div>
              </div>
            </div>
          `).join('')}
        </div></div>
      </div>
    `
  }

  // Assemble button
  if (state.completed.has('images') && !state.completed.has('video')) {
    main += `
      <div class="assemble" style="margin-top:20px">
        <h3>▶ Ready to Assemble</h3>
        <p>All images generated. Assemble into a video with transitions, narration, and background music via Gemini.</p>
        <button class="btn-start" onclick="assembleVideo()" ${state.generating?'disabled':''}>
          ${state.generating?'<div class="spinner"></div> Assembling Video...':'Assemble Video →'}
        </button>
      </div>
    `
  }

  // Video preview
  if (state.completed.has('video')) {
    main += `
      <div class="card" style="margin-top:20px">
        <div class="card-head">
          <h3><svg viewBox="0 0 24 24" fill="none" stroke="var(--emerald)" stroke-width="2" stroke-linecap="round" style="width:17px;height:17px"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Video Ready</h3>
          <div class="badge badge-g">● Export Ready</div>
        </div>
        <div class="card-body">
          <div class="player">
            <div class="play-btn"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
            <div class="player-bottom">
              <div class="player-timeline"></div>
              <div class="player-info"><span>0:00 / 1:00</span><span>1080p · H.264</span></div>
            </div>
          </div>
          <div class="vid-actions">
            <button class="vid-btn primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export MP4</button>
            <button class="vid-btn secondary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg> Share</button>
            <button class="vid-btn secondary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg> Regenerate</button>
          </div>
          <div class="meta">
            <div class="meta-row"><span class="meta-k">Format</span><span class="meta-v">MP4 (H.264)</span></div>
            <div class="meta-row"><span class="meta-k">Resolution</span><span class="meta-v">1080 × 1920</span></div>
            <div class="meta-row"><span class="meta-k">Duration</span><span class="meta-v">1:00</span></div>
            <div class="meta-row"><span class="meta-k">Scenes</span><span class="meta-v">6</span></div>
            <div class="meta-row"><span class="meta-k">Image Model</span><span class="meta-v">Nano Banana Pro</span></div>
            <div class="meta-row"><span class="meta-k">AI Engine</span><span class="meta-v">Gemini 2.5 Pro</span></div>
          </div>
        </div>
      </div>
    `
  }

  el.innerHTML = `
    ${statsHTML()}
    ${pipeHTML()}
    <div class="two-col">
      <div>${main}</div>
      <div class="side-col">${logHTML()}</div>
    </div>
  `

  // restore focus
  const ti = document.getElementById('topic-input')
  if (ti && document.activeElement?.tagName !== 'INPUT' && document.activeElement?.tagName !== 'TEXTAREA') {
    // don't steal focus
  }

  buildNav()
}

// Boot
render()
</script>
